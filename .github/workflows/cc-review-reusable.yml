name: Unattended cc-review
on:
  workflow_call:
    inputs:
      integration_ref:
        description: Immutable cc-review commit (same as caller uses ref)
        required: true
        type: string
      app_id:
        required: false
        type: string
        default: ''
      anthropic_base_url:
        required: false
        type: string
        default: ''
      aws_region:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: us-east-1
      google_project:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: ''
      google_region:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: us-east5
      federation_rule_id:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: ''
      anthropic_organization_id:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: ''
      anthropic_service_account_id:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: ''
      anthropic_workspace_id:
        description: Deprecated and ignored (removed provider)
        required: false
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        description: Deprecated and ignored (removed provider)
        required: false
      app_private_key:
        required: false
      aws_access_key_id:
        description: Deprecated and ignored (removed provider)
        required: false
      aws_secret_access_key:
        description: Deprecated and ignored (removed provider)
        required: false
      aws_session_token:
        description: Deprecated and ignored (removed provider)
        required: false
      google_credentials:
        description: Deprecated and ignored (removed provider)
        required: false
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Validate immutable integration ref
        shell: bash
        env:
          CC_REF: ${{ inputs.integration_ref }}
        run: '[[ "$CC_REF" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rhuss/cc-review
          ref: ${{ inputs.integration_ref }}
          path: _cc_review
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _target
          persist-credentials: false
      # Reactions on command comments come from the same App identity as all other output.
      # Fork review events carry no secrets; selection then falls back to github.token and ignores them.
      - name: Mint selection token
        if: inputs.app_id != ''
        continue-on-error: true
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
      - name: Select enabled eligible requests
        id: select
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: python3 _cc_review/review/core/scripts/ci.py select --config _target/.cc-review/ci.yml
  item:
    needs: select
    if: needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: cc-review-${{ github.repository }}-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rhuss/cc-review
          ref: ${{ inputs.integration_ref }}
          path: _cc_review
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _target
          persist-credentials: false
      # Writing guidance only (text read into the prompt, never executed). A failed
      # checkout falls back to the bundled maintainer voice.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: rhuss/cc-prose
          ref: 8cb884b297e83e6002911c7cee8a0011fd016b31
          path: _cc_prose
          persist-credentials: false
      - name: Mint scoped installation token
        if: inputs.app_id != ''
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: ${{ matrix.operation == 'fix' && 'write' || 'read' }}
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
      - name: Prepare
        id: prepare
        uses: ./_cc_review/ci
        with:
          phase: prepare
          config: _target/.cc-review/ci.yml
          request: ${{ toJSON(matrix) }}
          project_dir: _target
          prose_dir: _cc_prose
          work_dir: ${{ runner.temp }}/cc-review-ci
          github_token: ${{ steps.app.outputs.token || github.token }}
      - name: Analyze bounded evidence (read-only code tools for assessments only)
        if: steps.prepare.outputs.run_model == 'true'
        id: model
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.timeout || '15') }}
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@d5f7970ae232b6039636a16ea7f251e58e814f38
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          CLAUDE_WORKING_DIR: ${{ runner.temp }}/cc-review-ci
          ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        with:
          prompt_file: ${{ runner.temp }}/cc-review-ci/prompt.txt
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_args: >-
            --model ${{ steps.prepare.outputs.model }}
            --max-turns ${{ steps.prepare.outputs.turns }}
            --tools "${{ steps.prepare.outputs.tools }}" --permission-mode dontAsk
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Grep(//proc/**)" "Grep(//sys/**)" "Glob(//proc/**)" "Glob(//sys/**)"
            ${{ steps.prepare.outputs.code_dir && format('--add-dir {0}', steps.prepare.outputs.code_dir) || '' }}
            --strict-mcp-config --mcp-config '{"mcpServers":{}}'
            --setting-sources "" --disable-slash-commands
            --plugin-dir ${{ github.workspace }}/_cc_review/review
            --json-schema '${{ steps.prepare.outputs.schema }}'
      - name: Finalize even on analysis failure
        if: always() && steps.prepare.outcome == 'success'
        uses: ./_cc_review/ci
        with:
          phase: finish
          config: _target/.cc-review/ci.yml
          work_dir: ${{ runner.temp }}/cc-review-ci
          github_token: ${{ steps.app.outputs.token || github.token }}
          result: ${{ steps.model.outcome == 'success' && steps.model.outputs.conclusion == 'success' && steps.model.outputs.structured_output || '' }}
      - name: Remove temporary item evidence
        if: always()
        env:
          CC_WORK_DIR: ${{ runner.temp }}/cc-review-ci
        run: rm -rf -- "$CC_WORK_DIR"
