# cc-review default configuration
# Copy to .cc-review/config.yml in your project root (project-level)
# or to ~/.cc-review/config.yml (user-level) to customize.
#
# Resolution order: CLI flags > --config > --profile > project config > user config > these defaults
#
# Reviewers are plugins discovered from .cc-review/reviewers/ (project),
# ~/.cc-review/reviewers/ (user) and the bundled core/reviewers/ directory.
# Enable or disable any discovered reviewer with reviewers.<name>. A reviewer
# without a key uses the `enabled` default from its own frontmatter; these
# defaults set no key, so that frontmatter default (and the `enabled` value of
# a user or project override) applies. Bundled defaults: every reviewer is
# enabled except copilot and gator.
# The legacy keys agents.* and external_tools.* still work but are deprecated.
#
# reviewers:
#   test-quality: false
#   gator: true
#   accessibility: true     # a project or user reviewer

severity:
  min_confidence: 70
  request_changes_severities:
    - Critical
    - Important
  auto_fix: true

pr_posting:
  enabled: true
  auto_detect_pr: false
  max_inline_comments: 50
  voice_profile: "reviewer"
  recovery_dir: ".cc-review"

output:
  dir: "."
  verbosity: "normal"
  findings_filename: "review-findings.md"

test:
  command: ""
  timeout_seconds: 300

triage:
  bot_profiles:
    - login: "coderabbitai[bot]"
      self_resolves: true
      auto_resolve: false
    - login: "copilot[bot]"
      self_resolves: false
      auto_resolve: true
    - login: "devin-ai-integration[bot]"
      self_resolves: false
      auto_resolve: true
  codecov:
    patch_threshold: 80
    auto_remediate: true

meta_review:
  enabled: true
  min_findings: 5

interactive: true

max_fix_rounds: 3
