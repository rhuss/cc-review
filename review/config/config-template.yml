# cc-review default configuration
# Copy to .cc-review/config.yml in your project root (project-level)
# or to ~/.cc-review/config.yml (user-level) to customize.
#
# Resolution order: CLI flags > --config > --profile > project config > user config > these defaults

agents:
  correctness: true
  architecture: true
  security: true
  production: true
  test_quality: true
  goal_alignment: true

external_tools:
  coderabbit: true
  copilot: false
  codex: true

severity:
  min_confidence: 70
  request_changes_severities:
    - Critical
    - Important
  auto_fix: true

pr_posting:
  enabled: true
  auto_detect_pr: false
  max_inline_comments: 50
  voice_profile: "reviewer"
  recovery_dir: ".cc-review"

output:
  dir: "."
  verbosity: "normal"
  findings_filename: "review-findings.md"

test:
  command: ""
  timeout_seconds: 300

triage:
  bot_profiles:
    - login: "coderabbitai[bot]"
      self_resolves: true
      auto_resolve: false
    - login: "copilot[bot]"
      self_resolves: false
      auto_resolve: true
    - login: "devin-ai-integration[bot]"
      self_resolves: false
      auto_resolve: true
  codecov:
    patch_threshold: 80
    auto_remediate: true

interactive: true

max_fix_rounds: 3
