# Quick profile: of the bundled reviewers only correctness + security, no command reviewers, 1 fix round.
# User and project reviewers keep their own enabled default; use --only for a strict allowlist.
reviewers:
  correctness: true
  architecture: false
  security: true
  production: false
  test-quality: false
  goal-alignment: false
  coderabbit: false
  copilot: false
  codex: false
  gator: false

severity:
  min_confidence: 70
  request_changes_severities:
    - Critical
  auto_fix: true

output:
  verbosity: "quiet"

max_fix_rounds: 1
