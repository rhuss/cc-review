# Thorough profile: all bundled reviewers except gator, strict thresholds, 5 fix rounds
reviewers:
  correctness: true
  architecture: true
  security: true
  production: true
  test-quality: true
  goal-alignment: true
  coderabbit: true
  copilot: true
  codex: true
  gator: false

severity:
  min_confidence: 80
  request_changes_severities:
    - Critical
    - Important
    - Minor
  auto_fix: true

output:
  verbosity: "normal"

max_fix_rounds: 5
