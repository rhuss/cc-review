# CI profile: all bundled reviewers except gator and greptile, verbose output, no interactive prompts
reviewers:
  correctness: true
  architecture: true
  security: true
  production: true
  test-quality: true
  goal-alignment: true
  coderabbit: true
  copilot: true
  codex: true
  greptile: false   # spends Greptile credits on every run
  gator: false

severity:
  min_confidence: 70
  request_changes_severities:
    - Critical
    - Important
  auto_fix: true

pr_posting:
  enabled: false

output:
  verbosity: "verbose"

interactive: false

max_fix_rounds: 3
