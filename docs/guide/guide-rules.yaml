# Per-page content rules, checked by `make check` (tools/guide/check.py).
# Each rule applies to the files matching `glob` (relative to the guide project root):
#   require:        every regex must match somewhere in each file
#   forbid:         no regex may match anywhere in each file
#   require_order:  the first matches of these regexes must appear in this order
# Page tasks add rules for their page before writing it, so the check fails first.
# The forbid patterns use Python regex unicode escapes (U+2014 em dash and
# U+2013 en dash) so this rules file never carries the characters it bans.
rules:
  - glob: docs/README.md
    require:
      - '\]\(using/index\.md\)'
      - '\]\(extending/index\.md\)'
      - '\]\(how-it-works/index\.md\)'
      - 'assets/diagrams/core-and-layers\.svg'
      - 'guide:attr cc-review-commit-short'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/using/install.md
    require:
      - '^#'
      - 'jq'
      - 'yq'
      - '\bgh\b'
      - 'Python'
      - 'install\.sh'
      - '(?m)^Check:'
    require_order:
      - 'marketplace add'
      - 'plugin install'
      - 'install\.sh'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/using/review.md
    require:
      - '/cc-review:review'
      - '--pr'
      - 'quick'
      - 'thorough'
      - 'ci'
      - 'Critical'
      - 'Important'
      - '(?m)^Check:'
    forbid:
      - '\u2014'
      - '\u2013'
      - '/Users/'
  - glob: docs/using/triage.md
    require:
      - '/cc-review:triage'
      - '--pr'
      - 'bot'
      - '(?m)^Check:'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/using/inbox-and-issue.md
    require:
      - '/cc-review:inbox'
      - '/cc-review:issue'
      - 'read-only'
      - '(?m)^Check:'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/using/index.md
    require:
      - '\]\(install\.md\)'
      - '\]\(review\.md\)'
      - '\]\(triage\.md\)'
      - '\]\(inbox-and-issue\.md\)'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/index.md
    require:
      - '\]\(pipeline\.md\)'
      - '\]\(reviewers\.md\)'
      - '\]\(meta-review\.md\)'
      - '\]\(gate-and-fix\.md\)'
      - '\]\(results\.md\)'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/pipeline.md
    require:
      - 'assets/diagrams/review-pipeline\.svg'
      - '[Dd]iscover'
      - '[Dd]ispatch'
      - '[Mm]erge'
      - '[Mm]eta-review'
      - '[Gg]ate'
      - '[Rr]eport'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/reviewers.md
    require:
      - 'Correctness'
      - 'Security'
      - '[Ss]tay in your lane'
      - 'confidence'
      - 'gator'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/meta-review.md
    require:
      - 'assets/diagrams/two-critics\.svg'
      - 'Skeptic'
      - 'Calibrator'
      - 'also_reported_by'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/gate-and-fix.md
    require:
      - 'Critical'
      - 'Important'
      - 'Notable'
      - '3'
      - 're-review'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/how-it-works/results.md
    require:
      - '[Mm]easured'
      - 'OpenShell'
      - '208'
      - 'pull/'
    forbid:
      - '\u2014'
      - '\u2013'
      - '/Users/'
  - glob: docs/extending/index.md
    require:
      - 'assets/diagrams/core-and-layers\.svg'
      - '\]\(prompt-reviewer\.md\)'
      - '\]\(command-reviewer\.md\)'
      - '\]\(trust-and-config\.md\)'
      - 'project'
      - 'bundled'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/extending/prompt-reviewer.md
    require:
      - 'kind: prompt'
      - 'frontmatter'
      - '--only'
      - '(?m)^Check:'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/extending/command-reviewer.md
    require:
      - 'kind: command'
      - 'detect'
      - 'invoke'
      - 'severity_map'
      - '(?m)^Check:'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/extending/trust-and-config.md
    require:
      - 'trusted-reviewers'
      - 'sha256'
      - '--no-'
      - 'reviewers:'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/reference/cli.md
    require:
      - '--pr'
      - '--bulk'
      - '--only'
      - '--spec'
      - 'quick'
      - 'thorough'
      - 'ci'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/reference/config-and-schema.md
    require:
      - 'resolution'
      - '--profile'
      - 'Critical'
      - 'Important'
      - 'Minor'
      - 'Notable'
      - 'severity_map'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/reference/invocation.md
    require:
      - '/cc-review:review'
      - '\$review'
      - '/review'
      - 'Claude Code'
      - 'Codex'
      - 'OpenCode'
    forbid:
      - '\u2014'
      - '\u2013'
  - glob: docs/reference/index.md
    require:
      - '\]\(cli\.md\)'
      - '\]\(config-and-schema\.md\)'
      - '\]\(invocation\.md\)'
    forbid:
      - '\u2014'
      - '\u2013'
